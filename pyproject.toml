[project]
name = "object-storage-api"
description = "Python microservice providing an API for handling attachments and images in an S3 object store."
readme = "README.md"
requires-python = ">=3.13"
version = "1.4.0"

dependencies = [
    "cryptography>=48.0.0",
    "fastapi[all]>=0.139.0",
    "pyjwt>=2.13.0",
    "pymongo>=4.17.0",
    "boto3>=1.43.48",
    "pillow>=12.3.0",
]

[project.urls]
Repository = "https://github.com/ral-facilities/object-storage-api"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
object-storage-api = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[dependency-groups]
code-analysis = [{ include-group = "test" }, "black>=26.3.1", "pylint>=4.0.5"]

test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "requests>=2.33.1",
]

scripts = [
    "faker>=40.31.0",
    "faker-file[pdf,docx,images]>=0.19.1",

]

dev = [
    { include-group = "code-analysis" },
    { include-group = "test" },
    { include-group = "scripts" },
]

[tool.coverage.run]
omit = [
    # Exclude test code from coverage measurement
    "test/*",
    # Exclude routers from coverage measurement as they are tested in the e2e tests
    "object_storage_api/v1/*",
]

[tool.setuptools.packages.find]
include  = [
    "object_storage_api",
    "object_storage_api*",
]
